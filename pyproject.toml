[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waste-classification-transfer-learning"
version = "1.0.0"
description = "Waste classification using VGG16 transfer learning for recyclable vs organic image recognition."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mohamad Sabbagh" }]
keywords = [
  "computer-vision",
  "deep-learning",
  "image-classification",
  "keras",
  "recycling",
  "sustainability",
  "tensorflow",
  "transfer-learning",
  "vgg16",
  "waste-classification",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/ezedeem223/waste-classification-transfer-learning"
Issues = "https://github.com/ezedeem223/waste-classification-transfer-learning/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["data", "models", "notebooks", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
